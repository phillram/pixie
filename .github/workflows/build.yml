name: Build

# Only a version tag builds, once per release. Pushes to main and pull
# requests do not. A manual run builds without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Pixie.exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check the package holds together
        run: python tools/check_wiring.py

      # The full self-tests capture the real screen and send real input, so
      # they need a desktop session and are run locally rather than here.
      # Building the exe is the check that matters on CI: it exercises every
      # import and catches a broken module layout.
      - name: Build the executable
        run: python tools/build_exe.py

      # No upload-artifact step: artifacts count against Actions storage.
      # The exe goes to the release instead, which does not.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          Pixie.exe
          --title "Pixie ${{ github.ref_name }}"
          --generate-notes
